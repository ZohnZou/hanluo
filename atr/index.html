<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATR止损 - 寒洛交付中心</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#e6edf3; --muted:#8b949e; --red:#f85149; --green:#3fb950; --blue:#58a6ff; --amber:#d29922; --purple:#bc8cff; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:'Microsoft YaHei','PingFang SC',sans-serif; line-height:1.6; padding:20px 16px; max-width:960px; margin:0 auto; }
  a { color:var(--blue); text-decoration:none; }
  .header { text-align:center; padding:24px 0 16px; }
  .header h1 { font-size:24px; letter-spacing:2px; }
  .header .sub { color:var(--muted); font-size:13px; margin-top:6px; }
  .back { display:inline-block; margin-bottom:14px; font-size:13px; color:var(--muted); }
  .back:hover { color:var(--blue); }
  .new-badge { background:var(--red); color:#fff; font-size:10px; padding:1px 7px; border-radius:8px; margin-left:8px; flex-shrink:0; font-weight:700; }
  .new-dot { display:inline-block; background:var(--red); color:#fff; font-size:11px; min-width:18px; height:18px; line-height:18px; text-align:center; border-radius:9px; padding:0 5px; }

  .list-title { font-size:20px; font-weight:700; margin:8px 0 4px; }
  .list-sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .item { display:flex; align-items:center; gap:10px; padding:11px 14px; margin:6px 0; background:var(--card); border:1px solid var(--border); border-radius:10px; color:var(--text); min-width:0; }
  .item:hover { border-color:var(--blue); }
  .item .date { font-family:monospace; color:var(--muted); font-size:12px; white-space:nowrap; }
  .item .t { flex:1; font-size:14px; min-width:0; overflow-wrap:anywhere; word-break:break-word; }
  .foot { text-align:center; color:var(--muted); font-size:12px; margin:24px 0 8px; }
  @media (max-width:640px) { .list-title{font-size:18px;} .item .t{font-size:13px;} }
</style>
</head>
<body>
  <a class="back" href="../">← 返回总目录</a>
  <div class="list-title">ATR止损</div>
  <div class="list-sub">共 8 份 · 按日期倒序 · <span style="color:var(--red)">NEW</span>=新增未读，点开即消除</div>
  <div id="list"></div>
  <div class="foot">寒洛 · 自动更新</div>
<script>

const NEW_DAYS = 30;
function getReadSet() {
  try { return new Set(JSON.parse(localStorage.getItem('hanluo_read') || '[]')); }
  catch(e) { return new Set(); }
}
function markRead(url, el) {
  const s = getReadSet(); s.add(url);
  localStorage.setItem('hanluo_read', JSON.stringify([...s]));
  if (el) { const b = el.querySelector('.new-badge'); if (b) b.remove(); }
}
function isNew(date, url) {
  const d = new Date(date + 'T00:00:00');
  const cutoff = new Date(); cutoff.setDate(cutoff.getDate() - NEW_DAYS);
  return d >= cutoff && !getReadSet().has(url);
}

const TYPE = "ATR止损";
fetch('../index.json').then(r=>r.json()).then(data => {
  const items = data.items.filter(i => i.type === TYPE).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const list = document.getElementById('list');
  items.forEach(i => {
    const url = i.url.replace('atr/', '');
    const a = document.createElement('a');
    a.className = 'item';
    a.href = url;
    a.onclick = function(){ markRead(i.url, this); };
    a.innerHTML = '<span class="date">'+i.date+'</span><span class="t">'+i.title+'</span>';
    if (isNew(i.date, i.url)) a.innerHTML += '<span class="new-badge">NEW</span>';
    list.appendChild(a);
  });
});
</script>
</body>
</html>
